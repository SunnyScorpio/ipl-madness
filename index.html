<!DOCTYPE html>
<!--
  ipl-madness — notes for future-me

  Live at:  https://SunnyScorpio.github.io/ipl-madness/
  Source:   Google Sheet  1VgNuBgScnWmENeMt2PK1qoZZ_57hPdvA, gid 2127335045
            (configured in the SHEET_ID / GID consts at top of <script>)

  Local preview: `python -m http.server 8080`, then localhost:8080.
                 DO NOT double-click this file — Chrome blocks the Google
                 fetch from file:// pages (CORS).

  League scoring (per match):
    correct pick           = 2 pts
    abandoned (N/A winner) = 1 pt for anyone who entered a pick
    wrong / no pick        = 0
    future (TBD or blank)  = not scored

  Bracket scoring (end of season — see BRACKET_POINTS map in script):
    Playoff Qualifier 1-4, 3rd, 4th = 5 pts each
    2nd Place (finalist)            = 10 pts
    Champion                        = 15 pts
    Bracket points roll into the main leaderboard total.

  Fuzzy matching: case-insensitive everywhere. The ALIASES map (PK→PBKS,
                  RC→RCB) and the PBK* prefix rule live in the script.
                  Add more aliases there if a friend keeps typoing.

  Streak: consecutive correct picks counting back from the most recent
          played match. Abandoned matches don't break or extend it.
          Hot (>0) = green, cold (0) = muted orange.

  Match Grid auto-scroll: opening that tab scrolls smoothly to the
          boundary between played and upcoming matches, centered.

  Validation banner: site computes its own totals and only flags the
          maintainer when our total drops BELOW theirs (would mean a
          real scoring bug). Bonuses from fuzzy matching are silent.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ipl-madness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0e0f12;
    --panel:    #16181d;
    --panel-2:  #1c1f26;
    --line:     #2a2e38;
    --text:     #e8e9ec;
    --muted:    #8c8f99;
    --accent:   #ff6b1a;
    --good:     #57c777;
    --bad:      #c4642e;
    --gold:     #f5c542;
    --silver:   #b8bcc6;
    --bronze:   #c98a5a;
    --warn:     #f5c542;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(255,107,26,0.08), transparent 60%),
      radial-gradient(800px 500px at -10% 20%, rgba(29,161,242,0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 48px 32px 24px;
    border-bottom: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 60% 80% at 50% 50%, black, transparent);
    opacity: 0.4;
    pointer-events: none;
  }
  .header-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; position: relative; }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 8vw, 96px);
    line-height: 0.9;
    letter-spacing: -0.02em;
  }
  .brand .dot { color: var(--accent); }
  .tagline {
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: 13px;
    margin-top: 12px;
    letter-spacing: 0.03em;
  }
  .tagline .live {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--good);
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 0 0 rgba(87,199,119,0.6);
    animation: pulse 2s infinite;
    vertical-align: middle;
  }
  .tagline .live.error { background: var(--bad); animation: none; }
  .tagline .live.warn  { background: var(--warn); animation: none; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(87,199,119,0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(87,199,119,0); }
    100% { box-shadow: 0 0 0 0 rgba(87,199,119,0); }
  }
  .refresh-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  .refresh-btn:hover { background: var(--panel-2); border-color: var(--accent); }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .refresh-btn .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  .refresh-btn.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs {
    display: flex; gap: 4px;
    padding: 0 32px;
    border-bottom: 1px solid var(--line);
    margin-top: 24px;
    overflow-x: auto;
  }
  .tab {
    background: none; border: none;
    color: var(--muted);
    font-family: 'Manrope', sans-serif;
    font-weight: 600; font-size: 14px;
    padding: 14px 20px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  main { padding: 32px; max-width: 1400px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active {
    display: block;
    animation: slideIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Brand entrance (one-time on page load) ─────────── */
  .brand {
    animation: brandIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .brand .dot {
    display: inline-block;
    animation: dotPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
  }
  @keyframes brandIn {
    from { opacity: 0; transform: translateY(-12px); letter-spacing: -0.05em; }
    to   { opacity: 1; transform: translateY(0);     letter-spacing: -0.02em; }
  }
  @keyframes dotPop {
    0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg);    opacity: 1; }
  }

  /* ── Stats cards: cascade in on first render ────────── */
  .stat {
    opacity: 0;
    animation: statIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .stat:nth-child(1) { animation-delay: 0.05s; }
  .stat:nth-child(2) { animation-delay: 0.15s; }
  .stat:nth-child(3) { animation-delay: 0.25s; }
  .stat:nth-child(4) { animation-delay: 0.35s; }
  @keyframes statIn {
    from { opacity: 0; transform: translateY(12px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    }
  }
  .stat {
    transition: transform 0.2s, border-color 0.2s;
  }
  .stat:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }

  .stats-bar {
    display: flex; gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 20px;
    flex: 1;
    min-width: 140px;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; line-height: 1;
    margin-top: 6px;
  }

  .leaderboard {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .lb-row {
    display: grid;
    grid-template-columns: 64px 1fr auto auto;
    gap: 16px; align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    transition: background 0.2s, transform 0.2s;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row:hover { background: var(--panel-2); transform: translateX(4px); }
  .lb-row.head {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    background: var(--panel-2);
  }
  .lb-row.head { transform: none !important; }
  .lb-row.head:hover { background: var(--panel-2); }

  /* Cascade rows in from bottom-up so the leader lands last (a payoff) */
  .lb-row:not(.head) {
    opacity: 0;
    animation: rowIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-16px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Leader (#1) gets a subtle gold shimmer that loops slowly */
  .lb-row.leader {
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(245, 197, 66, 0.06) 50%,
      transparent 100%
    );
    background-size: 200% 100%;
    animation: rowIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both,
               leaderShimmer 4s ease-in-out infinite 1s;
  }
  @keyframes leaderShimmer {
    0%, 100% { background-position: -100% 0; }
    50%      { background-position:  100% 0; }
  }

  /* Big points number gets a gentle pulse on the leader */
  .lb-row.leader .points {
    animation: pointsPulse 3s ease-in-out infinite 1.5s;
  }
  @keyframes pointsPulse {
    0%, 100% { text-shadow: 0 0 0    rgba(255, 107, 26, 0); }
    50%      { text-shadow: 0 0 12px rgba(255, 107, 26, 0.4); }
  }
  .rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; color: var(--muted);
    text-align: center;
    width: 44px; height: 44px;
    line-height: 44px;
    border-radius: 50%;
    margin: 0 auto;
  }
  .rank.gold {
    color: #1a1400;
    background: linear-gradient(135deg, #f5c542, #e0a820);
    box-shadow: 0 0 12px rgba(245, 197, 66, 0.35);
  }
  .rank.silver {
    color: #1a1a1e;
    background: linear-gradient(135deg, #c8cdd6, #8f96a3);
    box-shadow: 0 0 10px rgba(184, 188, 198, 0.25);
  }
  .rank.bronze {
    color: #1a1208;
    background: linear-gradient(135deg, #c98a5a, #a06a3a);
    box-shadow: 0 0 10px rgba(201, 138, 90, 0.25);
  }
  .player-name { font-weight: 700; font-size: 17px; }
  .lb-row.head .player-name { font-weight: 600; font-size: 11px; }
  .points {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; color: var(--accent);
    line-height: 1; min-width: 56px; text-align: right;
  }
  .lb-row.head .points {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted);
  }
  .streak-col {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    min-width: 70px;
    text-align: right;
  }
  .lb-row.head .streak-col {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .streak-col.hot {
    color: var(--good);
  }
  .streak-col.cold {
    color: var(--bad);
    opacity: 0.7;
  }
  .streak-col.max-streak {
    color: var(--good);
    text-shadow: 0 0 10px rgba(87, 199, 119, 0.5);
    font-size: 26px;
  }

  .matches-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: auto;
    max-height: 75vh;
  }
  .matches-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .matches-table th, .matches-table td {
    padding: 8px 10px;
    text-align: center;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .matches-table th:last-child, .matches-table td:last-child { border-right: none; }
  .matches-table tr:last-child td { border-bottom: none; }
  .matches-table tbody tr {
    transition: background 0.15s;
  }
  .matches-table tbody tr:hover .pick.good { background: rgba(87,199,119,0.28); }
  .matches-table tbody tr:hover .pick.bad  { background: rgba(196,100,46,0.28); }
  .matches-table tbody tr:hover .col-match { background: var(--line); }
  .matches-table thead th {
    background: var(--panel-2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted); font-weight: 600;
    position: sticky; top: 0;
    z-index: 2;
  }
  .matches-table thead th .th-score {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 0;
    text-transform: none;
    margin-top: 2px;
    line-height: 1;
  }
  .matches-table .col-match {
    text-align: left;
    font-weight: 600;
    background: var(--panel-2);
    position: sticky; left: 0;
    z-index: 1;
    width: 240px;
    min-width: 240px;
    max-width: 240px;
    border-right: 2px solid var(--line);
  }
  .matches-table .col-match small {
    display: block;
    font-weight: 400;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    margin-top: 2px;
  }
  .matches-table thead .col-match { z-index: 3; }
  .matches-table .col-winner {
    font-weight: 700;
    color: var(--accent);
    position: sticky;
    left: 240px;
    z-index: 1;
    min-width: 90px;
    /* Solid background — equivalent to rgba(255,107,26,0.08) over var(--panel),
       but opaque so cells scrolling underneath don't bleed through */
    background: #211814;
    border-right: 2px solid var(--line);
  }
  .matches-table thead .col-winner {
    background: var(--panel-2);
    z-index: 3;
  }
  .pick.good { background: rgba(87,199,119,0.18); color: #aae8ba; font-weight: 600; }
  .pick.bad  { background: rgba(196,100,46,0.18); color: #e8b896; }
  .pick.aban { color: var(--gold); font-style: italic; }
  .pick.future, .col-winner.future { color: var(--muted); }

  .bracket-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    font-size: 13px;
  }
  .bracket-table th, .bracket-table td {
    padding: 12px 14px;
    text-align: center;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .bracket-table th:last-child, .bracket-table td:last-child { border-right: none; }
  .bracket-table tr:last-child td { border-bottom: none; }
  .bracket-table thead th {
    background: var(--panel-2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; text-transform: uppercase;
    color: var(--muted);
  }
  .bracket-table .col-position {
    text-align: left;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--accent);
    background: var(--panel-2);
  }
  .bracket-table .col-bracket-pts {
    background: var(--panel-2);
    width: 60px;
  }
  .bracket-table .col-winner {
    font-weight: 700;
    color: var(--accent);
    background: rgba(255,107,26,0.08);
  }
  .pts-badge {
    display: inline-block;
    background: rgba(255,107,26,0.15);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,107,26,0.3);
  }
  .pts-badge.dim {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
  }

  .banner {
    background: rgba(245, 197, 66, 0.08);
    border: 1px solid rgba(245, 197, 66, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--warn);
    display: none;
  }
  .banner.show { display: block; }

  footer {
    padding: 32px;
    text-align: center;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border-top: 1px solid var(--line);
    margin-top: 64px;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }

  /* Brief flash on the live indicator when fresh data arrives */
  .tagline .live.flash {
    animation: freshPulse 1.2s ease-out;
  }
  @keyframes freshPulse {
    0%   { box-shadow: 0 0 0 0   rgba(87,199,119,0.7); transform: scale(1); }
    20%  { transform: scale(1.6); }
    100% { box-shadow: 0 0 0 24px rgba(87,199,119,0);   transform: scale(1); }
  }

  /* Refresh button: small bounce when click registers */
  .refresh-btn:active:not(:disabled) {
    transform: scale(0.96);
    transition: transform 0.1s;
  }

  /* Stat numbers count up — give them a subtle glow during the count */
  .stat-value.counting {
    color: var(--accent);
    transition: color 0.6s;
  }

  /* Respect users who've asked the OS to limit motion. Animations still
     resolve (so layout is correct) but they're collapsed to nearly-instant. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  .state {
    text-align: center;
    padding: 80px 32px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .state h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--text);
    margin-bottom: 12px;
  }

  @media (max-width: 640px) {
    header { padding: 32px 20px 20px; }
    main { padding: 20px; }
    .tabs { padding: 0 20px; }
    .tab { padding: 12px 14px; font-size: 13px; }
    .lb-row { grid-template-columns: 44px 1fr auto auto; padding: 12px 16px; gap: 12px; }
    .rank { font-size: 22px; width: 36px; height: 36px; line-height: 36px; }
    .player-name { font-size: 15px; }
    .points { font-size: 24px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <div class="brand">ipl<span class="dot">·</span>madness</div>
      <div class="tagline"><span class="live" id="status-dot"></span> <span id="status">loading…</span></div>
    </div>
    <button class="refresh-btn" id="refresh-btn" title="Bypass cache and refetch">
      <span class="spinner"></span>
      <span>refresh</span>
    </button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-panel="leaderboard">Leaderboard</button>
  <button class="tab"        data-panel="matches">Match Grid</button>
  <button class="tab"        data-panel="bracket">Bracket Picks</button>
</nav>

<main>
  <div id="leaderboard" class="panel active">
    <div class="banner" id="validation-banner"></div>
    <div class="stats-bar" id="stats-bar"></div>
    <div class="leaderboard" id="leaderboard-list"></div>
  </div>

  <div id="matches" class="panel">
    <div class="matches-wrap">
      <table class="matches-table" id="matches-table"></table>
    </div>
  </div>

  <div id="bracket" class="panel">
    <p style="color: var(--muted); font-size: 13px; margin-bottom: 16px; font-family: 'JetBrains Mono', monospace;">
      end-of-season bracket predictions ·
      qualifiers / 3rd / 4th <span style="color: var(--accent);">5 pts</span> ·
      finalist <span style="color: var(--accent);">10 pts</span> ·
      champion <span style="color: var(--accent);">15 pts</span>
    </p>
    <div style="overflow-x: auto;">
      <table class="bracket-table" id="bracket-table"></table>
    </div>
  </div>
</main>

<footer>
  built for friends · static · zero backend ·
  data from <a id="source-link" href="#" target="_blank" rel="noopener">google sheets</a> ·
  <span id="generated-at"></span>
</footer>

<script>
  // ─── CONFIG ─────────────────────────────────────────────
  const SHEET_ID = "1VgNuBgScnWmENeMt2PK1qoZZ_57hPdvA";
  const GID = "2127335045";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
  const SHEET_VIEW_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${GID}`;
  document.getElementById('source-link').href = SHEET_VIEW_URL;

  // ─── CSV PARSING ────────────────────────────────────────
  function parseCSV(text) {
    const rows = [];
    let row = [], cell = '', inQ = false, i = 0;
    while (i < text.length) {
      const c = text[i];
      if (inQ) {
        if (c === '"' && text[i+1] === '"') { cell += '"'; i += 2; continue; }
        if (c === '"') { inQ = false; i++; continue; }
        cell += c; i++;
      } else {
        if (c === '"') { inQ = true; i++; continue; }
        if (c === ',') { row.push(cell); cell = ''; i++; continue; }
        if (c === '\r') { i++; continue; }
        if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
        cell += c; i++;
      }
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  // ─── SCORING ────────────────────────────────────────────
  // Normalize ONLY case + whitespace. Don't auto-correct typos —
  // the source sheet treats typos as wrong, and we match that.
  const norm = s => (s || '').trim().toUpperCase();

  const TEAM_SHORT = {
    'ROYAL CHALLENGERS BENGALURU': 'RCB',
    'MUMBAI INDIANS': 'MI',
    'CHENNAI SUPER KINGS': 'CSK',
    'KOLKATA KNIGHT RIDERS': 'KKR',
    'SUNRISERS HYDERABAD': 'SRH',
    'PUNJAB KINGS': 'PBKS',
    'RAJASTHAN ROYALS': 'RR',
    'GUJARAT TITANS': 'GT',
    'GUJARAT LITANS': 'GT',  // typo in source
    'LUCKNOW SUPER GIANTS': 'LSG',
    'DELHI CAPITALS': 'DC',
  };
  // Known team short codes (used to canonicalize whatever the user typed).
  const TEAM_CODES = ['RCB','MI','CSK','KKR','SRH','PBKS','RR','GT','LSG','DC'];

  // Canonicalize a pick or winner to a known team code, with fuzzy matching:
  //   - case-insensitive, trims whitespace
  //   - full team name → short code  (e.g. "Mumbai Indians" → "MI")
  //   - PBK* prefix → PBKS  (so PBK, PBKA, PBKs all count as Punjab Kings)
  //   - PK → PBKS  (explicit alias)
  //   - RC → RCB  (explicit alias)
  //   - exact short-code match → itself
  // Returns the canonical code, or '' if unrecognized.
  const ALIASES = { 'PK': 'PBKS', 'RC': 'RCB' };
  function canonicalize(s) {
    const u = norm(s);
    if (!u) return '';
    if (TEAM_SHORT[u]) return TEAM_SHORT[u];     // full name → code
    if (TEAM_CODES.includes(u)) return u;        // already a code
    if (ALIASES[u]) return ALIASES[u];           // explicit alias
    if (u.startsWith('PBK')) return 'PBKS';      // PBK* → PBKS
    return '';                                    // unrecognized — counts as wrong
  }

  // For display in the grid: prefer the canonical code, fall back to the raw text.
  const teamCode = name => canonicalize(name) || (name || '').trim();

  function scorePick(winner, pick) {
    // canonicalize() returns '' for non-team strings — fall back to norm()
    // so we can still detect TBD / N/A sentinels in the winner column.
    const w = canonicalize(winner) || norm(winner);
    const p = canonicalize(pick);
    if (!w || w === 'TBD') return { state: 'future', points: null };
    if (w === 'N/A')       return { state: p ? 'aban-picked' : 'aban-blank', points: p ? 1 : 0 };
    if (p && p === w)      return { state: 'good', points: 2 };
    return { state: 'bad', points: 0 };
  }

  // ─── BRACKET SCORING ────────────────────────────────────
  // Bracket rows are scored more heavily than league matches because they're
  // harder, longer-horizon picks. Match against the LABEL in column 0
  // (case-insensitive, ignoring extra whitespace) to pull the right multiplier.
  const BRACKET_POINTS = {
    'PLAYOFF QUALIFIER 1': 5,
    'PLAYOFF QUALIFIER 2': 5,
    'PLAYOFF QUALIFIER 3': 5,
    'PLAYOFF QUALIFIER 4': 5,
    '4TH PLACE': 5,
    '3RD PLACE': 5,
    '2ND PLACE': 10,       // finalist
    'CHAMPION':  15,       // winner of the season
  };
  const bracketPoints = label => BRACKET_POINTS[norm(label)] ?? 0;

  // ─── PARSE THE SHEET ────────────────────────────────────
  function processCSV(rows) {
    const headerRow = rows[2] || [];
    const totalsRow = rows[0] || [];
    const players = [];
    const playerCols = [];
    for (let c = 6; c < headerRow.length; c += 2) {
      const name = (headerRow[c] || '').trim();
      if (!name || norm(name) === 'POINTS') break;
      players.push(name);
      playerCols.push(c);
    }
    const maintainerTotals = {};
    players.forEach((p, i) => {
      const v = totalsRow[playerCols[i]];
      maintainerTotals[p] = v ? parseInt(v, 10) || 0 : 0;
    });

    const leagueMatches = [];
    const bracketRows   = [];

    for (let r = 3; r < rows.length; r++) {
      const row = rows[r];
      if (!row || row.length < 6) continue;
      const date  = (row[0] || '').trim();
      const time  = (row[1] || '').trim();
      const venue = (row[2] || '').trim();
      const t1raw = (row[3] || '').trim();
      const t2raw = (row[4] || '').trim();
      const winnerRaw = (row[5] || '').trim();

      const picks = {};
      players.forEach((p, i) => {
        const col = playerCols[i];
        picks[p] = (row[col] || '').trim();
      });

      if (t1raw && t2raw) {
        leagueMatches.push({
          date, time, venue,
          team1: t1raw, team2: t2raw,
          team1Code: teamCode(t1raw), team2Code: teamCode(t2raw),
          winnerRaw, winnerCode: teamCode(winnerRaw),
          picks,
        });
      } else if (date) {
        bracketRows.push({ label: date, winnerRaw, picks });
      }
    }

    const totals = {}, correct = {}, bracketTotals = {};
    players.forEach(p => {
      totals[p] = 0; correct[p] = 0; bracketTotals[p] = 0;
    });
    let played = 0, abandonedCount = 0, future = 0;
    leagueMatches.forEach(m => {
      const w = norm(m.winnerRaw);
      if (!w || w === 'TBD') { future++; return; }
      if (w === 'N/A')        { abandonedCount++; }
      else                    { played++; }
      players.forEach(p => {
        const r = scorePick(m.winnerRaw, m.picks[p]);
        if (r.state === 'good')             { totals[p] += 2; correct[p]++; }
        else if (r.state === 'aban-picked') { totals[p] += 1; }
      });
    });

    // Bracket scoring — only kicks in once the maintainer fills in winners
    // for each bracket row (Playoff Qualifier 1–4, 2nd Place, Champion).
    // Until then those rows stay at "TBD" and don't score.
    bracketRows.forEach(b => {
      const w = canonicalize(b.winnerRaw);
      const value = bracketPoints(b.label);
      b.points = value;       // remember the rule for display
      b.resolved = !!w;       // truthy once maintainer fills the winner
      if (!w || value === 0) return;
      players.forEach(p => {
        if (canonicalize(b.picks[p]) === w) {
          totals[p] += value;
          bracketTotals[p] += value;
        }
      });
    });

    // Compare to maintainer's totals. Fuzzy matching (PBK*, PK→PBKS, RC→RCB)
    // means our totals can legitimately exceed theirs. Only flag mine < theirs,
    // which would indicate a real scoring bug.
    const discrepancies = [];
    players.forEach(p => {
      if (totals[p] < maintainerTotals[p]) {
        discrepancies.push({ player: p, mine: totals[p], theirs: maintainerTotals[p] });
      }
    });

    // Streak: walk played matches in reverse. Count consecutive correct picks
    // from the most recent match backward. Stop at the first non-correct result.
    // Abandoned matches don't break or extend a streak — skip them.
    const streaks = {};
    players.forEach(p => {
      let streak = 0;
      // Walk backwards through league matches, only considering played ones
      for (let i = leagueMatches.length - 1; i >= 0; i--) {
        const m = leagueMatches[i];
        const w = norm(m.winnerRaw);
        if (!w || w === 'TBD') continue;    // future — skip
        if (w === 'N/A') continue;          // abandoned — skip, doesn't break streak
        const r = scorePick(m.winnerRaw, m.picks[p]);
        if (r.state === 'good') { streak++; }
        else { break; }                    // wrong pick — streak ends
      }
      streaks[p] = streak;
    });

    const leaderboard = players
      .map(p => ({
        player: p,
        total: totals[p],
        correct: correct[p],          // used as a sort tiebreaker only
        bracket: bracketTotals[p],
        streak: streaks[p],
      }))
      .sort((a, b) => b.total - a.total || b.correct - a.correct || a.player.localeCompare(b.player));

    // Defensive: empty list would make Math.max return -Infinity.
    const maxStreak = leaderboard.length ? Math.max(...leaderboard.map(r => r.streak)) : 0;

    return {
      players, leaderboard,
      leagueMatches, bracketRows,
      played, abandoned: abandonedCount, future,
      totalMatches: leagueMatches.length,
      discrepancies,
      maxStreak,
    };
  }

  // ─── ANIMATION HELPERS ──────────────────────────────────
  // Animate a number from start to end over duration ms.
  // Skips animation entirely if user has prefers-reduced-motion set.
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function countUp(el, end, duration = 800) {
    if (reducedMotion || end === 0) { el.textContent = end; return; }
    const start = 0;
    const startTime = performance.now();
    el.classList.add('counting');
    function tick(now) {
      const t = Math.min(1, (now - startTime) / duration);
      // ease-out cubic
      const eased = 1 - Math.pow(1 - t, 3);
      const value = Math.round(start + (end - start) * eased);
      el.textContent = value;
      if (t < 1) requestAnimationFrame(tick);
      else el.classList.remove('counting');
    }
    requestAnimationFrame(tick);
  }

  // Animate "X / Y" format (e.g. "35 / 70")
  function countUpFraction(el, num, denom, duration = 800) {
    if (reducedMotion) { el.textContent = `${num} / ${denom}`; return; }
    const startTime = performance.now();
    function tick(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = `${Math.round(num * eased)} / ${denom}`;
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ─── RENDERING ──────────────────────────────────────────
  function renderStats(d) {
    // Leaders: everyone tied for the top score (often just one person)
    const top = d.leaderboard[0]?.total;
    const leaders = top !== undefined ? d.leaderboard.filter(r => r.total === top) : [];
    const leaderLabel = leaders.length > 1 ? 'Leaders' : 'Leader';
    const leaderNames = leaders.map(r => r.player).join(', ') || '—';

    document.getElementById('stats-bar').innerHTML = `
      <div class="stat">
        <div class="stat-label">Season</div>
        <div class="stat-value">IPL 2026</div>
      </div>
      <div class="stat">
        <div class="stat-label">Matches Scored</div>
        <div class="stat-value" id="stat-matches">0 / ${d.totalMatches}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Players</div>
        <div class="stat-value" id="stat-players">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">${leaderLabel}</div>
        <div class="stat-value">${leaderNames}</div>
      </div>
    `;
    // Trigger count-ups after the cards have animated in (CSS delays go up to ~0.85s)
    setTimeout(() => {
      countUpFraction(document.getElementById('stat-matches'), d.played + d.abandoned, d.totalMatches);
      countUp(document.getElementById('stat-players'), d.players.length);
    }, reducedMotion ? 0 : 400);
  }

  function renderLeaderboard(d) {
    const total = d.leaderboard.length;

    // Dense ranking: tied totals share the same rank, next rank increments by 1.
    // e.g. 45, 41, 41, 39 → ranks 1, 2, 2, 3
    const ranks = [];
    d.leaderboard.forEach((row, i) => {
      if (i === 0 || row.total < d.leaderboard[i - 1].total) {
        ranks.push(i === 0 ? 1 : ranks[i - 1] + 1);
      } else {
        ranks.push(ranks[i - 1]);
      }
    });

    // Medal class based on rank, not position — so tied #1s both get gold.
    const cls = rank => rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';

    document.getElementById('leaderboard-list').innerHTML = `
      <div class="lb-row head">
        <div class="rank">#</div>
        <div class="player-name">Player</div>
        <div class="points">Points</div>
        <div class="streak-col">Streak</div>
      </div>
      ${d.leaderboard.map((row, i) => {
        const delay = (total - 1 - i) * 0.04;
        const leaderClass = ranks[i] === 1 ? ' leader' : '';
        const isHot = row.streak > 0;
        const isMaxStreak = row.streak === d.maxStreak && d.maxStreak > 0;
        const streakCls = isHot ? 'hot' : 'cold';
        const maxCls = isMaxStreak ? ' max-streak' : '';
        const fireIcon = isHot ? '🔥 ' : '';
        return `
          <div class="lb-row${leaderClass}" style="animation-delay: ${delay}s;">
            <div class="rank ${cls(ranks[i])}">${ranks[i]}</div>
            <div class="player-name">${row.player}</div>
            <div class="points" data-final="${row.total}">0</div>
            <div class="streak-col ${streakCls}${maxCls}">${fireIcon}${row.streak}</div>
          </div>
        `;
      }).join('')}
    `;
    // Animate the points numbers after their rows have settled
    if (reducedMotion) {
      document.querySelectorAll('.lb-row .points[data-final]').forEach(el => {
        el.textContent = el.dataset.final;
      });
    } else {
      d.leaderboard.forEach((row, i) => {
        const rowDelay = (total - 1 - i) * 40;
        setTimeout(() => {
          const el = document.querySelectorAll('.lb-row:not(.head) .points')[i];
          if (el) countUp(el, row.total, 600);
        }, rowDelay + 200);
      });
    }
  }

  function renderMatches(d) {
    const tbl = document.getElementById('matches-table');
    // Build a quick lookup for player totals
    const playerTotals = {};
    d.leaderboard.forEach(r => { playerTotals[r.player] = r.total; });
    const head = `
      <thead>
        <tr>
          <th class="col-match">Match</th>
          <th class="col-winner">Winner</th>
          ${d.players.map(p => `<th>${p}<span class="th-score">${playerTotals[p] ?? 0}</span></th>`).join('')}
        </tr>
      </thead>
    `;
    const body = `
      <tbody>
        ${d.leagueMatches.map((m, idx) => {
          const w = norm(m.winnerRaw);
          const isFuture = !w || w === 'TBD';
          const isAban   = w === 'N/A';
          const winnerCell = isFuture
            ? `<td class="col-winner future">—</td>`
            : isAban
              ? `<td class="col-winner aban">abandoned</td>`
              : `<td class="col-winner">${m.winnerCode}</td>`;
          const cells = d.players.map(p => {
            const pickRaw = m.picks[p];
            const display = teamCode(pickRaw) || (pickRaw || '—');
            const r = scorePick(m.winnerRaw, pickRaw);
            const cls = r.state === 'good' ? 'good'
                      : r.state === 'bad'  ? 'bad'
                      : r.state.startsWith('aban') ? 'aban'
                      : 'future';
            return `<td class="pick ${cls}">${display}</td>`;
          }).join('');
          const dateLabel = m.date || '';
          return `<tr>
            <td class="col-match">
              M${idx + 1}: ${m.team1Code} v ${m.team2Code}
              ${dateLabel ? `<small>${dateLabel}${m.venue ? ' · ' + m.venue : ''}</small>` : ''}
            </td>
            ${winnerCell}
            ${cells}
          </tr>`;
        }).join('')}
      </tbody>
    `;
    tbl.innerHTML = head + body;
  }

  function renderBracket(d) {
    const tbl = document.getElementById('bracket-table');
    if (!d.bracketRows.length) {
      tbl.innerHTML = `<tr><td style="padding: 32px; color: var(--muted);">No bracket predictions yet.</td></tr>`;
      return;
    }
    tbl.innerHTML = `
      <thead>
        <tr>
          <th class="col-position">Position</th>
          <th class="col-bracket-pts">Pts</th>
          <th class="col-winner">Winner</th>
          ${d.players.map(p => `<th>${p}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${d.bracketRows.map(r => {
          const w = canonicalize(r.winnerRaw);
          const winnerCell = r.resolved
            ? `<td class="col-winner">${w}</td>`
            : `<td class="col-winner future">—</td>`;
          const ptsBadge = r.points > 0
            ? `<td class="col-bracket-pts"><span class="pts-badge">${r.points}</span></td>`
            : `<td class="col-bracket-pts"><span class="pts-badge dim">—</span></td>`;
          const cells = d.players.map(p => {
            const pickRaw = r.picks[p];
            const display = teamCode(pickRaw) || (pickRaw || '—');
            if (!r.resolved || r.points === 0) {
              return `<td class="pick future">${display}</td>`;
            }
            const correct = canonicalize(pickRaw) === w;
            return `<td class="pick ${correct ? 'good' : 'bad'}">${display}</td>`;
          }).join('');
          return `<tr>
            <td class="col-position">${r.label}</td>
            ${ptsBadge}
            ${winnerCell}
            ${cells}
          </tr>`;
        }).join('')}
      </tbody>
    `;
  }

  function renderValidation(d) {
    const banner = document.getElementById('validation-banner');
    if (!d.discrepancies.length) { banner.classList.remove('show'); return; }
    const list = d.discrepancies
      .map(x => `${x.player} (computed ${x.mine}, sheet says ${x.theirs})`)
      .join(', ');
    banner.textContent = `⚠ scoring discrepancy: ${list}. let claude know.`;
    banner.classList.add('show');
  }

  function setStatus(text, state) {
    document.getElementById('status').textContent = text;
    const dot = document.getElementById('status-dot');
    dot.classList.remove('error', 'warn');
    if (state === 'error') dot.classList.add('error');
    if (state === 'warn')  dot.classList.add('warn');
  }

  // ─── BOOT & REFRESH ─────────────────────────────────────
  async function load(bypassCache = false) {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('loading');
    btn.disabled = true;
    setStatus('fetching latest…', 'warn');

    try {
      const url = bypassCache ? `${CSV_URL}&_=${Date.now()}` : CSV_URL;
      const res = await fetch(url, { cache: bypassCache ? 'no-store' : 'default' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const rows = parseCSV(text);
      const d = processCSV(rows);

      renderValidation(d);
      renderStats(d);
      renderLeaderboard(d);
      renderMatches(d);
      renderBracket(d);

      const fetchedAt = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
      const summary = `IPL 2026 · ${d.played + d.abandoned} of ${d.totalMatches} matches scored`;
      setStatus(summary, d.discrepancies.length ? 'warn' : 'live');
      document.getElementById('generated-at').textContent = `last fetched ${fetchedAt}`;

      // Brief pulse on the live indicator to confirm fresh data arrived
      const dot = document.getElementById('status-dot');
      dot.classList.remove('flash');
      void dot.offsetWidth;  // force reflow so animation re-triggers
      dot.classList.add('flash');
    } catch (err) {
      console.error(err);
      setStatus(`couldn't fetch: ${err.message}`, 'error');
      document.querySelector('main').innerHTML = `
        <div class="state">
          <h2>can't reach the sheet</h2>
          <p>${err.message}</p>
          <p style="margin-top: 16px;">if the source sheet's sharing changed, the export URL may need updating.</p>
        </div>
      `;
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  // ─── MATCH GRID AUTO-SCROLL ─────────────────────────────
  // Smooth-scrolls the match table so the first future row (winner == "—")
  // lands at the vertical midpoint of the container, giving equal context
  // above (played matches) and below (upcoming). When all matches are done,
  // scrolls to the very bottom.
  function scrollToLatestMatch() {
    const wrap = document.querySelector('.matches-wrap');
    if (!wrap) return;

    // Find the first row whose winner cell contains exactly "—"
    const rows = wrap.querySelectorAll('tbody tr');
    let targetRow = null;
    for (const row of rows) {
      const winnerCell = row.querySelector('.col-winner');
      if (winnerCell && winnerCell.textContent.trim() === '—') {
        targetRow = row;
        break;
      }
    }

    // Desired scrollTop: place targetRow at the vertical midpoint of wrap.
    // If no future row exists (season complete), scroll to the bottom.
    const wrapHeight = wrap.clientHeight;
    let desiredScrollTop;
    if (targetRow) {
      // offsetTop is relative to the table; account for the sticky thead height
      const thead = wrap.querySelector('thead');
      const theadHeight = thead ? thead.offsetHeight : 0;
      const rowMidpoint = targetRow.offsetTop + targetRow.offsetHeight / 2;
      desiredScrollTop = rowMidpoint - wrapHeight / 2;
    } else {
      desiredScrollTop = wrap.scrollHeight - wrapHeight;
    }
    desiredScrollTop = Math.max(0, desiredScrollTop);

    // Animate with RAF using ease-in-out-cubic so it feels deliberate, not abrupt.
    if (reducedMotion) { wrap.scrollTop = desiredScrollTop; return; }
    const startTop  = wrap.scrollTop;
    const delta     = desiredScrollTop - startTop;
    if (Math.abs(delta) < 2) return;   // already there
    const duration  = Math.min(900, Math.max(400, Math.abs(delta) * 0.6));
    const startTime = performance.now();

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function tick(now) {
      const t = Math.min(1, (now - startTime) / duration);
      wrap.scrollTop = startTop + delta * easeInOutCubic(t);
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.panel).classList.add('active');
      // Trigger match-grid scroll whenever that tab is opened
      if (btn.dataset.panel === 'matches') {
        // Small delay so the panel is visible before we measure offsetTop
        setTimeout(scrollToLatestMatch, 50);
      }
    });
  });

  document.getElementById('refresh-btn').addEventListener('click', () => load(true));

  load(false);
</script>
</body>
</html>
